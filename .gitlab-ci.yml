# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:          # List of stages for jobs, and their order of execution
  - test



variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"

cache:
  key: pip-cache
  paths:
    - .cache/pip

unit-tests:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install . pytest requests-mock
  script:
    - pytest tests/unit -v
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml

integration_tests:
  stage: test
  image: python:${PYTHON_VERSION}
  services:
    - name: nocodb/nocodb:latest
      alias: nocodb
  variables:
    NOCODB_HOST: http://nocodb:8080
    PYTHONUNBUFFERED: "1"
  before_script:
    - pip install --upgrade pip
    - pip install .[dev] || pip install .
    - pip install pytest requests
    # wait for NocoDB to fully start up
    - echo "Waiting for NocoDB to be ready..."
    - |
      for i in {1..40}; do
        curl -s $NOCODB_HOST &>/dev/null && echo "✅ NocoDB is ready!" && break
        echo "⏳ Waiting ($i)..."
        sleep 3
    # 🔹 Generate admin user and obtain API token
    - |
      ADMIN_EMAIL="admin@gmail.com"
      ADMIN_PASSWORD="12345678"
      echo "Creating NocoDB admin user $ADMIN_EMAIL"

      response=$(curl -s -X POST \
        -H "Content-Type: application/json" \
        -d '{
              "email": "'$ADMIN_EMAIL'",
              "password": "'"$ADMIN_PASSWORD"'",
              "ignore_subscribe": true,
              "token": ""
            }' \
        "$NOCODB_HOST/api/v1/auth/user/signup")

      user_token=$(echo "$response" | jq -r '.token')

      if [[ -z "$user_token" || "$user_token" == "null" ]]; then
        echo "❌ Failed to sign up admin user:"
        echo "$response"
        exit 1
      fi

      echo "✅ Admin user created. Fetching default token..."

      response=$(curl -s -X POST "$NOCODB_HOST/api/v1/tokens" \
        -H "Content-Type: application/json" \
        -H "xc-auth: $user_token" \
        -d '{"description":"Default-Token"}')

      token=$(echo "$response" | jq -r '.token')

      if [[ -z "$token" || "$token" == "null" ]]; then
        echo "❌ Failed to create NocoDB token:"
        echo "$response"
        exit 1
      fi

      echo "✅ Got API token: ${token:0:10}..."
      export NOCODB_TOKEN=$token
      echo "NOCODB_TOKEN=$token" >> variables.env
  script:
    - echo "Running integration tests against $NOCODB_HOST"
    - pytest tests/integration -v --maxfail=1 --disable-warnings
  only:
    - main
    - merge_requests

