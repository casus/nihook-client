[project]
name = "nihook-client"
version = "0.1.0"
description = "A simple NocoDB API v2 wrapper"
authors = [
    {name = "Dmitrii Okishev",email = "d.okishev@hzdr.de"}
]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
nihook-client = "nihook_client.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "requests-mock>=1.11.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
pythonpath = ["src"]
